<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>blink</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pk:#ff3d9a;--pk2:#ffb8dc;--sf:#150a11;--ln:#4a1d36;--tx:#fff0f7;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--tx);font-family:Syne,system-ui,sans-serif}
[hidden]{display:none!important}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 14px;gap:10px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;flex:none}
h1{font-weight:800;font-size:32px;letter-spacing:-.05em;color:var(--pk)}
h1 i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pk);margin-left:3px;animation:bl 4s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.b{border:1.5px solid var(--ln);background:var(--sf);color:var(--tx);font:600 13px Syne,system-ui,sans-serif;padding:9px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;flex:none}
.b:hover,.b.on{border-color:var(--pk)}
.b.pk,.chip.on{background:var(--pk);color:#000;border-color:var(--pk)}
:focus-visible{outline:2px solid var(--pk2);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;flex:none}
.tabs{display:flex;gap:18px;flex:none;align-items:center;border-bottom:1px solid var(--ln)}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px;padding:6px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a1738c}
.tab:hover{border-color:transparent;color:var(--tx)}
.tab.sel{border-bottom-color:var(--pk);color:var(--tx)}
.tab.has::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pk);margin-left:6px}
.chip[data-n]:not([data-n=""])::after{content:attr(data-n);margin-left:7px;background:#000;color:var(--pk);border-radius:9px;padding:0 6px}
.box{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.stage{position:relative;height:100%;aspect-ratio:3/4;max-width:100%;border-radius:28px;overflow:hidden;border:2px solid var(--pk);box-shadow:0 0 44px rgba(255,61,154,.28)}
#pv{width:100%;height:100%;object-fit:cover;display:block}
#cd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 130px Syne,sans-serif;color:#fff;text-shadow:0 0 30px var(--pk);pointer-events:none}
#cd small{font-size:16px;font-weight:700;color:var(--pk2);text-shadow:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;flex:none;padding:4px 2px}
#gal{width:56px;height:74px;border:1.5px solid var(--pk);border-radius:14px;background:var(--sf);padding:0;overflow:hidden;cursor:pointer}
#gt{width:100%;height:100%;display:block}
#shut{width:82px;height:82px;border-radius:50%;border:3px solid var(--pk);background:transparent;padding:6px;cursor:pointer}
#shut::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:var(--pk);box-shadow:0 0 26px rgba(255,61,154,.6);transition:transform .12s}
#shut:active::after{transform:scale(.82)}
#booth{justify-self:end}
#ec{max-width:100%;max-height:100%;border-radius:18px;border:2px solid var(--pk)}
.row{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.sl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;font-size:13px;color:var(--pk2);flex:none}
input[type=range]{accent-color:var(--pk);width:100%}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:auto;align-content:start}
.th{border:1.5px solid var(--ln);border-radius:12px;padding:0;overflow:hidden;background:var(--sf);cursor:pointer}
.th:hover{border-color:var(--pk)}.th canvas{width:100%;display:block}
.em{grid-column:1/-1;color:var(--pk2);padding:30px 0;text-align:center}
#gate,#sm{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#gate h2{font-size:64px;font-weight:800;letter-spacing:-.06em;color:var(--pk)}
#gate p{max-width:320px;line-height:1.5;color:var(--pk2)}
#gerr{color:#fff;min-height:20px;font-size:14px}
#sm{justify-content:flex-start;padding-top:calc(16px + env(safe-area-inset-top,0px));overflow:auto}
#sc{max-height:66dvh;max-width:100%;border-radius:6px;box-shadow:0 0 44px rgba(255,61,154,.3)}
.b[data-a]{background:var(--pk);color:#000;border-color:var(--pk)}
.cell{position:relative}
.x{position:absolute;top:6px;right:6px;border:0;border-radius:99px;background:rgba(0,0,0,.78);color:var(--pk2);font:700 12px Syne,system-ui,sans-serif;padding:5px 10px;cursor:pointer}
.x[data-a]{background:var(--pk);color:#000}
.stage{touch-action:none}
.zoom{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.6);border:1px solid var(--ln);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--pk2)}
.zoom span{min-width:34px}
.ars{display:flex;gap:6px;align-items:center;flex:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a1738c}
.ars span{margin-right:6px}
.ar{border-radius:8px;padding:5px 10px;font-size:12px}
.ar.sel{border-color:var(--pk);color:var(--pk)}
#ec{touch-action:none;cursor:grab}
.box{position:relative}
#co,#cbar,#chint{display:none}
#ed.crop #co{display:block}#ed.crop #cbar{display:flex}#ed.crop #chint{display:block}
#ed.crop .chips,#ed.crop .tabs,#ed.crop .ars,#ed.crop .sl,#ed.crop #mrow{display:none}
#co{position:absolute;overflow:hidden;touch-action:none}
#cr{position:absolute;border:2px solid var(--pk);box-shadow:0 0 0 9999px rgba(0,0,0,.62);cursor:move;
 background:linear-gradient(rgba(255,184,220,.35),rgba(255,184,220,.35)) 33.3% 0/1px 100% no-repeat,linear-gradient(rgba(255,184,220,.35),rgba(255,184,220,.35)) 66.6% 0/1px 100% no-repeat,linear-gradient(rgba(255,184,220,.35),rgba(255,184,220,.35)) 0 33.3%/100% 1px no-repeat,linear-gradient(rgba(255,184,220,.35),rgba(255,184,220,.35)) 0 66.6%/100% 1px no-repeat}
.hd{position:absolute;width:30px;height:30px;display:grid;place-items:center}
.hd::after{content:"";width:12px;height:12px;background:var(--pk);border:2px solid #000;border-radius:3px}
#chint{font-size:12px;color:var(--pk2);text-align:center;flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
 <header><h1>blink<i></i></h1><button class="b" id="flip">flip camera</button></header>

 <section id="cam" class="view">
  <div class="box"><div class="stage"><canvas id="pv"></canvas><div id="cd"></div><div id="flash"></div><div class="zoom"><span id="zl">1.0×</span><input type="range" id="zm" min="1" max="4" step=".05" value="1" aria-label="Zoom"></div></div></div>
  <div class="chips" id="chips"></div>
  <div class="bar">
   <button id="gal" aria-label="Open gallery"><canvas id="gt" width="56" height="74"></canvas></button>
   <button id="shut" aria-label="Take photo"></button>
   <button class="b" id="booth">photo strip</button>
  </div>
 </section>

 <section id="ed" class="view" hidden>
  <div class="box" id="eb"><canvas id="ec"></canvas><div id="co"><div id="cr"></div></div></div>
  <p id="chint">drag the window to move it, drag the handles to resize</p>
  <div class="chips" id="echips"></div>
  <div class="ars" id="ars"><span>crop</span></div>
  <div class="sl"><label for="br">brightness</label><input type="range" id="br" min="-60" max="60" value="0"><label for="ct">contrast</label><input type="range" id="ct" min=".6" max="1.6" step=".05" value="1"><label for="zc">zoom</label><input type="range" id="zc" min="1" max="4" step=".05" value="1"></div>
  <div class="row" id="cbar"><button class="b pk" id="capply">apply crop</button><button class="b" id="cfull">full photo</button><button class="b" id="ccancel">cancel</button></div>
  <div class="row" id="mrow"><button class="b" id="back">camera</button><button class="b" id="undo">undo filter</button><button class="b" id="clr">reset</button><button class="b" id="del">delete photo</button><button class="b" id="mc">manual crop</button><button class="b pk" id="dl">download</button></div>
 </section>

 <section id="gl" class="view" hidden>
  <div id="grid"></div>
  <div class="row"><button class="b pk" id="gback">camera</button><button class="b" id="delall">delete all</button></div>
 </section>
</div>

<div id="gate">
 <h2>blink</h2>
 <p>Blink needs your camera to show live filters. Nothing is uploaded: every photo stays on your device.</p>
 <button class="b pk" id="allow">Allow camera</button>
 <div id="gerr" role="alert"></div>
</div>

<div id="sm" hidden>
 <canvas id="sc"></canvas>
 <div class="row" style="justify-content:center">
  <button class="b on" id="tb">black strip</button><button class="b" id="tp">pink strip</button><button class="b" id="tw">white strip</button>
  <button class="b pk" id="sdl">download strip</button><button class="b" id="sx">close</button>
 </div>
</div>

<script>
const $=s=>document.querySelector(s),sleep=t=>new Promise(r=>setTimeout(r,t));
const GROUPS={
 soft:[['glow','soft glow'],['dream','dreamy'],['fade','matte fade'],['film','film grain'],['leak','light leak'],['bokeh','bokeh'],['sparkle','sparkle'],['blush','blush']],
 color:[['cherry','cherry'],['sunset','sunset'],['lilac','lilac'],['y2k','y2k'],['rose','rosé'],['mono','mono'],['noir','noir'],['poster','poster'],['invert','invert']],
 effects:[['dots','dots'],['pixel','pixel'],['glitch','glitch'],['vhs','vhs'],['chroma','chroma'],['neon','neon edge'],['grain','grain'],['scan','scanlines'],['vig','vignette'],['polaroid','polaroid']]
};
const tmp=document.createElement('canvas'),tc=tmp.getContext('2d');
const lum=(d,i)=>.3*d[i]+.59*d[i+1]+.11*d[i+2],mix=(a,b,t)=>a+(b-a)*t;
const BA=[document.createElement('canvas'),document.createElement('canvas')];
function blur(c,w,h,k){let src=c.canvas,cw=w,ch=h,n=0;const st=Math.round(Math.log2(k)),ws=[[w,h]];
 for(let i=0;i<st;i++){cw=Math.ceil(cw/2);ch=Math.ceil(ch/2);ws.push([cw,ch]);const d=BA[n++%2];d.width=cw;d.height=ch;d.getContext('2d').drawImage(src,0,0,cw,ch);src=d}
 for(let i=st-1;i>=0;i--){const d=BA[n++%2];d.width=ws[i][0];d.height=ws[i][1];const x=d.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,d.width,d.height);src=d}
 return src}
function gmap(c,w,h,st){px(c,w,h,d=>{const m=st.length-1;for(let i=0;i<d.length;i+=4){const t=lum(d,i)/255*m,k=Math.min(m-1,Math.floor(t)),u=t-k,a=st[k],b=st[k+1];
 d[i]=mix(a[0],b[0],u);d[i+1]=mix(a[1],b[1],u);d[i+2]=mix(a[2],b[2],u)}})}
function rnd(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
let LIVE=false,zoom=1;const BK={};
['S','H','Hp','N','P','O','M','T'].forEach(k=>{BK[k]=document.createElement('canvas');BK[k+'x']=BK[k].getContext('2d',{willReadFrequently:k==='S'||k==='T'})});
const fit=(k,W,H)=>{if(BK[k].width!==W||BK[k].height!==H){BK[k].width=W;BK[k].height=H}};
function box(L,w,h,r){const T=new Float32Array(w*h),O=new Float32Array(w*h),k=2*r+1,cl=(v,m)=>Math.min(m,Math.max(0,v));
 for(let y=0;y<h;y++){let s=0;const o=y*w;for(let x=-r;x<=r;x++)s+=L[o+cl(x,w-1)];
  for(let x=0;x<w;x++){T[o+x]=s/k;s+=L[o+cl(x+r+1,w-1)]-L[o+cl(x-r,w-1)]}}
 for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=T[cl(y,h-1)*w+x];
  for(let y=0;y<h;y++){O[y*w+x]=s/k;s+=T[cl(y+r+1,h-1)*w+x]-T[cl(y-r,h-1)*w+x]}}
 return O}
/* subject (person) estimate: colour models of a centre seed vs border seed + a centre-weighted prior, no ML download needed */
function subjMask(d,w,h,prev){
 const N=w*h,bin=new Uint16Array(N),F=new Float32Array(512),G=new Float32Array(512),S=new Float32Array(N);let nf=0,ng=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,o=i*4,u=x/w,v=y/h,b=(d[o]>>5)<<6|(d[o+1]>>5)<<3|(d[o+2]>>5);bin[i]=b;
  if(((u-.5)/.16)**2+((v-.48)/.22)**2<1||(v>.8&&Math.abs(u-.5)<.26)){F[b]++;nf++}
  else if(((u<.1||u>.9)&&v<.75)||v<.1){G[b]++;ng++}}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,u=x/w,v=y/h,pf=F[bin[i]]/nf+.002,pg=G[bin[i]]/ng+.002;
  S[i]=.7*pf/(pf+pg)+.3*Math.exp(-(((u-.5)/.3)**2+((v-.62)/.45)**2)/2)}
 const M=box(box(S,w,h,2),w,h,2),m=new Float32Array(N);let t=0;
 for(let i=0;i<N;i++){const q=Math.min(1,Math.max(0,(M[i]-.47)/.2));m[i]=q*q*(3-2*q);t+=m[i]}
 if(t/N<.06||t/N>.92)for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w,v=y/h;m[y*w+x]=Math.min(1,Math.max(0,1.6-Math.hypot((u-.5)/.28,(v-.55)/.42)))}
 if(prev&&prev.length===N)for(let i=0;i<N;i++)m[i]=.6*prev[i]+.4*m[i];
 return m}
function px(c,w,h,fn){const im=c.getImageData(0,0,w,h);fn(im.data,w,h);c.putImageData(im,0,0)}
const FX={
 mono:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i+=4)d[i]=d[i+1]=d[i+2]=lum(d,i)}),
 rose:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i+=4){const t=lum(d,i)/255;let r,g,b;
  if(t<.5){const u=t*2;r=mix(12,255,u);g=mix(0,50,u);b=mix(10,150,u)}else{const u=(t-.5)*2;r=255;g=mix(50,205,u);b=mix(150,230,u)}
  d[i]=r;d[i+1]=g;d[i+2]=b}}),
 noir:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i+=4)d[i]=d[i+1]=d[i+2]=(lum(d,i)-128)*1.7+120}),
 dots:(c,w,h)=>{const d=c.getImageData(0,0,w,h).data,s=Math.max(6,Math.round(w/64));c.fillStyle='#000';c.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){const i=(Math.min(h-1,y+(s>>1))*w+Math.min(w-1,x+(s>>1)))*4,l=lum(d,i)/255;
   c.fillStyle=`rgb(${d[i]},${d[i+1]},${d[i+2]})`;c.beginPath();c.arc(x+s/2,y+s/2,s*.56*Math.sqrt(l),0,6.283);c.fill()}},
 pixel:(c,w,h)=>{const s=Math.max(6,w/52);tmp.width=Math.ceil(w/s);tmp.height=Math.ceil(h/s);tc.drawImage(c.canvas,0,0,tmp.width,tmp.height);
  c.imageSmoothingEnabled=false;c.drawImage(tmp,0,0,tmp.width,tmp.height,0,0,tmp.width*s,tmp.height*s);c.imageSmoothingEnabled=true},
 glitch:(c,w,h)=>px(c,w,h,d=>{const o=new Uint8ClampedArray(d),k=Math.round(w*.012);
  for(let y=0;y<h;y++){const bd=Math.random()<.02?Math.round((Math.random()-.5)*w*.1):0;
   for(let x=0;x<w;x++){const xs=Math.min(w-1,Math.max(0,x+bd)),i=(y*w+x)*4;
    d[i]=o[(y*w+Math.min(w-1,xs+k))*4];d[i+1]=o[(y*w+xs)*4+1];d[i+2]=o[(y*w+Math.max(0,xs-k))*4+2]}}}),
 blush:(c,w,h)=>{c.save();c.globalCompositeOperation='screen';c.fillStyle='rgba(255,50,140,.3)';c.fillRect(0,0,w,h);c.restore()},
 poster:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i++)if(i%4<3)d[i]=Math.round(d[i]/85)*85}),
 invert:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i++)if(i%4<3)d[i]=255-d[i]}),
 grain:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*64;d[i]+=n;d[i+1]+=n;d[i+2]+=n}}),
 scan:(c,w,h)=>{const s=Math.max(3,Math.round(h/170));c.fillStyle='rgba(0,0,0,.4)';for(let y=0;y<h;y+=s)c.fillRect(0,y,w,Math.ceil(s/2.5))},
 vig:(c,w,h)=>{const g=c.createRadialGradient(w/2,h/2,h*.22,w/2,h/2,h*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.85)');c.fillStyle=g;c.fillRect(0,0,w,h)},
 glow:(c,w,h)=>{const b=blur(c,w,h,16);c.save();c.globalCompositeOperation='screen';c.globalAlpha=.65;c.drawImage(b,0,0,w,h);
  c.globalAlpha=1;c.fillStyle='rgba(255,90,170,.1)';c.fillRect(0,0,w,h);c.restore()},
 dream:(c,w,h)=>{const b=blur(c,w,h,8);c.save();c.globalAlpha=.55;c.drawImage(b,0,0,w,h);c.globalCompositeOperation='screen';c.globalAlpha=.4;c.drawImage(b,0,0,w,h);
  c.globalAlpha=1;c.fillStyle='rgba(255,150,205,.16)';c.fillRect(0,0,w,h);c.restore()},
 fade:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i+=4){d[i]=d[i]*.82+46;d[i+1]=d[i+1]*.82+38;d[i+2]=d[i+2]*.82+44}}),
 film:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*34;d[i]=d[i]*.92+28+n;d[i+1]=d[i+1]*.92+20+n;d[i+2]=d[i+2]*.88+22+n}}),
 cherry:(c,w,h)=>px(c,w,h,d=>{for(let i=0;i<d.length;i+=4){d[i]=d[i]*1.1+10;d[i+1]*=.86;d[i+2]=d[i+2]*1.02+8}}),
 leak:(c,w,h)=>{c.save();c.globalCompositeOperation='screen';
  let g=c.createLinearGradient(0,0,w*.9,h*.55);g.addColorStop(0,'rgba(255,50,140,.6)');g.addColorStop(.4,'rgba(255,150,100,.22)');g.addColorStop(1,'rgba(255,150,100,0)');
  c.fillStyle=g;c.fillRect(0,0,w,h);g=c.createRadialGradient(w,h,0,w,h,w*.7);g.addColorStop(0,'rgba(255,20,120,.45)');g.addColorStop(1,'rgba(255,20,120,0)');
  c.fillStyle=g;c.fillRect(0,0,w,h);c.restore()},
 vhs:(c,w,h)=>px(c,w,h,d=>{const o=new Uint8ClampedArray(d),k=Math.max(2,Math.round(w*.007));
  for(let y=0;y<h;y++){const dim=y%3===0?.82:1;for(let x=0;x<w;x++){const i=(y*w+x)*4,n=(Math.random()-.5)*26;
   d[i]=(o[(y*w+Math.min(w-1,x+k))*4]+n)*dim*1.05;d[i+1]=(o[i+1]+n)*dim;d[i+2]=(o[(y*w+Math.max(0,x-k))*4+2]+n)*dim*1.08}}}),
 sparkle:(c,w,h)=>{const r=rnd(11);c.save();c.shadowColor='#ff3d9a';
  for(let n=0;n<16;n++){const x=r()*w,y=r()*h,z=w*(.014+r()*.032);c.shadowBlur=z*1.8;c.fillStyle=n%3?'#fff':'#ffb8dc';c.beginPath();c.moveTo(x,y-z);
